name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Despliegue a Azure App Service
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://${{ vars.AZURE_WEBAPP_HOST }}

    env:
      VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}

    defaults:
      run:
        working-directory: presentacion

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Preparar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Instalar dependencias de producción
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Compilar el frontend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          npm run build
          rm .env

      # El paquete lleva las cuatro capas y los scripts de Azure en la raíz.
      # La carpeta public de la raíz atiende el sitio si Nginx sigue con la ruta anterior
      # (cuando App Service no reinicia): tiene los archivos estáticos y pasa lo demás a Laravel.
      - name: Empaquetar la versión
        working-directory: .
        run: |
          mkdir public
          cp -r presentacion/public/. public/
          printf '%s\n' '<?php' '' "require __DIR__.'/../presentacion/public/index.php';" > public/index.php
          zip -r -q -y "patronato-$VERSION.zip" presentacion negocio persistencia base-de-datos scripts public \
            -x 'presentacion/node_modules/*' 'presentacion/tests/*' 'presentacion/public/storage' 'presentacion/public/hot' \
               'presentacion/.env' 'presentacion/.env.*' 'base-de-datos/*.sqlite' '*/.git*'

      - name: Publicar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: patronato-${{ env.VERSION }}.zip
          type: zip
          clean: true

      - name: Comprobar que el sitio responde
        env:
          SITIO: https://${{ vars.AZURE_WEBAPP_HOST }}
        run: |
          for intento in $(seq 1 6); do
            if curl --fail --silent --show-error --max-time 20 "$SITIO/up" > /dev/null; then
              echo "Versión $VERSION en línea: $SITIO"
              exit 0
            fi
            echo "Intento $intento: el sitio todavía no responde"
            sleep 10
          done
          echo "El sitio no respondió en 5 minutos. Revisa el registro en Azure: Log stream." >&2
          exit 1
