name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verificar:
    name: Calidad, pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Configurar la aplicación
        id: configurar
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Compilar el frontend
        run: npm run build

      - name: Revisar estilo de PHP
        run: vendor/bin/pint --test

      - name: Análisis estático de PHP
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Revisar formato y lint del frontend
        run: npm run check

      - name: Revisar tipos de TypeScript
        run: npm run types:check

      # Cada historia corre aunque falle otra, para ver todas las que fallan
      - name: Pruebas HU-01 · Registrar un residencial
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Plataforma/RegistrarResidencialTest.php

      - name: Pruebas HU-02 · Aislar la información de cada residencial
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/AislamientoResidencialTest.php

      - name: Pruebas HU-03 · Suspender o reactivar un residencial
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Plataforma/SuspenderResidencialTest.php

      - name: Pruebas HU-04 · Iniciar sesión
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/AccesoTest.php tests/Feature/Auth/AuthenticationTest.php tests/Feature/ExampleTest.php

      - name: Pruebas HU-05 · Recuperar la contraseña
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/RecuperarPasswordTest.php tests/Feature/Auth/PasswordResetTest.php

      - name: Pruebas HU-06 · Administrar cuentas de usuario
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/CuentasTest.php tests/Feature/Identidad/PasswordTemporalTest.php

      - name: Pruebas HU-07 · Configurar permisos por rol
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/PermisosTest.php

      - name: Pruebas HU-08 · Consultar la bitácora de auditoría
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Identidad/BitacoraTest.php

      - name: Pruebas HU-09 · Respaldar y restaurar la base de datos
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Plataforma/RespaldosTest.php

      - name: Pruebas HU-10 · Registrar viviendas
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Padron/ViviendasTest.php tests/Feature/Padron/ViviendasInactivasTest.php

      - name: Pruebas HU-11 · Registrar residentes
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Padron/ResidentesTest.php

      - name: Pruebas HU-12 · Buscar vecinos y viviendas
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: php artisan test tests/Feature/Padron --filter=search

      - name: Pruebas de la base (perfil, verificación de correo y panel)
        if: ${{ !cancelled() && steps.configurar.outcome == 'success' }}
        run: >-
          php artisan test tests/Unit tests/Feature/Settings tests/Feature/DashboardTest.php
          tests/Feature/Auth/EmailVerificationTest.php tests/Feature/Auth/PasswordConfirmationTest.php
          tests/Feature/Auth/RegistrationTest.php tests/Feature/Auth/TwoFactorChallengeTest.php
          tests/Feature/Auth/VerificationNotificationTest.php

      - name: Guardar el frontend compilado
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: web/public/build
          retention-days: 7

  base-de-datos:
    name: Migraciones, respaldo y restauración en PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: patronato
          POSTGRES_USER: patronato_app
          POSTGRES_PASSWORD: solo_para_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patronato_app -d patronato"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: patronato
      DB_USERNAME: patronato_app
      DB_PASSWORD: solo_para_ci
      PGPASSWORD: solo_para_ci
      PG_BIN_PATH: /usr/lib/postgresql/18/bin

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar las herramientas de PostgreSQL 18
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Preparar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar la aplicación
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Aplicar las migraciones
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=RolesSeeder --force --no-interaction

      - name: Crear un respaldo
        run: php artisan respaldos:crear

      - name: Restaurar el respaldo en una base de prueba
        run: |
          "$PG_BIN_PATH/psql" --host=127.0.0.1 --username=patronato_app --dbname=patronato --command="CREATE DATABASE patronato_restaurada"
          php artisan respaldos:restaurar "$(ls storage/app/private/respaldos | head -n 1)" --base=patronato_restaurada

      - name: Comprobar que la base restaurada es igual a la original
        run: |
          consultar() {
            "$PG_BIN_PATH/psql" --host=127.0.0.1 --username=patronato_app --dbname="$1" --tuples-only --no-align \
              --command="SELECT (SELECT count(*) FROM pg_tables WHERE schemaname = 'public') || ' tablas, ' || (SELECT count(*) FROM roles) || ' roles'"
          }
          original="$(consultar patronato)"
          restaurada="$(consultar patronato_restaurada)"
          echo "Original: $original"
          echo "Restaurada: $restaurada"
          test "$original" = "$restaurada"
